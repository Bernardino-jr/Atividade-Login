<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icone">P</div>
            <span>Plataforma Aluno</span>
        </div>

        <h1>Entrar na sua conta</h1>

        <form>
            <label for="usuario">E-mail ou Usuário</label>
            <input type="text" id="usuario" placeholder="Digite seu e-mail ou usuário">

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha">

            <a href="#" class="esqueceu">Forgot Password?</a>

            <button type="submit">Entrar</button>
        </form>

        <p class="cadastro">Não tem conta? <a href="#">Cadastre-se</a></p>
    </div>
</body>
</html>
